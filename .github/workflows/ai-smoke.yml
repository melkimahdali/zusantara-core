name: AI smoke test

# Uji Zusantara AI dengan provider sungguhan. MEMAKAI KREDIT API, jadi hanya dijalankan manual:
# Actions -> AI smoke test -> Run workflow. Simpan API key sebagai secret repo
# (Settings -> Secrets and variables -> Actions), mis. OPENAI_API_KEY atau ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider yang dicoba lebih dulu
        type: choice
        options: [claude, openai, gemini, groq, deepseek, openrouter]
        default: claude
      model:
        description: Model (kosongkan untuk default provider)
        required: false

permissions:
  contents: read

jobs:
  ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium untuk uji widget chat
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Model pilihan
        if: inputs.model != ''
        run: |
          case "${{ inputs.provider }}" in
            claude) echo "ZUSANTARA_CLAUDE_MODEL=${{ inputs.model }}" >> "$GITHUB_ENV" ;;
            *) echo "$(echo '${{ inputs.provider }}' | tr a-z A-Z)_MODEL=${{ inputs.model }}" >> "$GITHUB_ENV" ;;
          esac
      - name: Jalankan uji AI
        env:
          ZUSANTARA_AI_ORDER: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/ai-smoke.mjs
