name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zusantara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZUSANTARA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/zusantara_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:build

  # Simulasi publish: npm pack, buat proyek dari tarball, install, test, build, jalankan server.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Ubuntu memakai npm terbaru (sama dengan workflow Release), Windows memakai npm bawaan Node.
      - name: npm terbaru (Ubuntu)
        if: runner.os == 'Linux'
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run e2e
