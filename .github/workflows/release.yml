name: Release

# Saat sebuah GitHub Release diterbitkan (tag v<versi>), workflow ini menguji semuanya lalu
# MENITIPKAN (stage) versi baru di npm lewat Trusted Publishing (OIDC, tanpa token tersimpan).
# Versi baru baru tayang setelah pemilik paket menyetujuinya dengan 2FA:
#   npm run release:approve   (mengambil ID stage dari run ini, lalu npm stage approve)
# Lihat PUBLISHING.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Pastikan npm mendukung trusted publishing & staged publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e

      - name: Cocokkan tag rilis dengan versi paket
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in zusantara create-zusantara; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$v" != "$TAG" ]; then
              echo "::error::Tag $TAG tidak cocok dengan versi $pkg ($v). Jalankan: node scripts/version.mjs <versi>"
              exit 1
            fi
          done

      - name: Titipkan (stage) ke npm, menunggu persetujuan pemilik
        env:
          # npm hanya bisa membuat provenance untuk repo publik; repo private tetap bisa rilis tanpa provenance.
          PROVENANCE: ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}
        run: |
          for pkg in zusantara create-zusantara; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$pkg@$v" version >/dev/null 2>&1; then
              echo "$pkg@$v sudah tayang di npm, dilewati"
              continue
            fi
            # npm stage tidak mengenal workspace: jalankan dari folder paketnya.
            # Nama paket zusantara dipesan dengan placeholder 1.0.0 (deprecated): versi rilis sungguhan harus diberi
            # tag latest secara eksplisit, karena npm menolak memindahkan latest ke versi yang lebih rendah.
            case "$v" in *-*) TAG_ARG="" ;; *) TAG_ARG="--tag latest" ;; esac
            out=$(cd "packages/$pkg" && npm stage publish --access public $TAG_ARG $PROVENANCE 2>&1 | tee /dev/stderr)
            id=$(echo "$out" | grep -oE 'staged with id [0-9a-f-]{36}' | head -1 | awk '{print $4}')
            if [ -z "$id" ]; then echo "::error::ID stage untuk $pkg@$v tidak ditemukan di output npm"; exit 1; fi
            # Anotasi bisa dibaca publik lewat API GitHub; dipakai oleh `npm run release:approve`.
            echo "::notice title=zusantara-stage::$pkg@$v stage-id=$id"
            {
              echo "### $pkg@$v menunggu persetujuan"
              echo '```'
              echo "npm stage approve $id"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Setujui semua sekaligus dari komputer Anda: npm run release:approve" >> "$GITHUB_STEP_SUMMARY"
